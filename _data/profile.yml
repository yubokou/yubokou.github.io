bio:
  - "I am the Haile Family Early Career Professor and an Associate Professor in the College of Information Sciences and Technology at Penn State. My research lies at the intersection of human-computer interaction, computer-supported cooperative work, and social computing. I use human-centered design methods to understand and design for digital safety on online platforms, such as video games, virtual worlds, and social media, and to inform the moderation mechanisms and platform policies that govern them."
  - "I co-direct the Health and Play Lab with Xinning Gui. Before Penn State, I was an Assistant Professor at Florida State University and a Postdoctoral Research Associate at Purdue University. I received my PhD in Information and Computer Sciences from the University of California, Irvine."

