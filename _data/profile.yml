bio:
  - "I'm an associate professor and the Haile Family Early Career Professor in the College of Information Sciences and Technology at the Pennsylvania State University (Penn State), where I also serve as Assistant Director of Master's Programs. My research lies in the intersection of HCI, CSCW, social computing, and usable privacy and security. My most current research interests are governance and play."
  - "Dr. Xinning Gui and I co-run the Health and Play Lab at Penn State. Before Penn State, I was an assistant professor at Florida State University and a postdoc at Purdue University. I received my PhD in Information and Computer Sciences from UC Irvine."

